name: Remote Nintendo 3DS container intake

on:
  # One-off push trigger for the exact commit subject:
  # "Run Ultra Sun CCI candidate screen with latest ARM subset".
  # The job-level condition prevents ordinary pushes from downloading the private image.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/remote-3ds-intake.yml"
  workflow_dispatch:
    inputs:
      target:
        description: Game version represented by the source image
        type: choice
        options:
          - ultra-sun
          - ultra-moon
        required: true
        default: ultra-sun
      format:
        description: Source format (.ccd is not a 3DS format)
        type: choice
        options:
          - 3ds
          - cci
          - cia
        required: true
        default: 3ds
      ncch_index:
        description: App partition/content index, usually 0
        type: string
        required: true
        default: "0"

permissions:
  contents: read

jobs:
  inspect-container:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Run Ultra Sun CCI candidate screen with latest ARM subset' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out main
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up Java for Ghidra 12.2
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Ghidra 12.2 requires JDK 25 or newer.
          java-version: "25"
      - name: Download and verify Ghidra 12.2
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ghidra_12.2_PUBLIC_20261016.zip"
          destination="$RUNNER_TEMP/ghidra-release"
          mkdir -p "$destination"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip' \
            --output "$archive"
          echo '2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67  '"$archive" | sha256sum --check -
          unzip -q "$archive" -d "$destination"
          headless="$(find "$destination" -type f -path '*/support/analyzeHeadless' -print -quit)"
          if [ -z "$headless" ]; then
            echo "::error::Ghidra analyzeHeadless was not found in the verified release"
            exit 1
          fi
          chmod +x "$headless"
          echo "GHIDRA_HEADLESS_PATH=$headless" >> "$GITHUB_ENV"
      - name: Download CTRTool release v1.3.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ctrtool-v1.3.0.zip"
          destination="$RUNNER_TEMP/ctrtool-release"
          mkdir -p "$destination"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            'https://github.com/3DSGuy/Project_CTR/releases/download/ctrtool-v1.3.0/ctrtool-v1.3.0-ubuntu_x86_64.zip' \
            --output "$archive"
          unzip -q "$archive" -d "$destination"
          ctrtool="$(find "$destination" -type f -name ctrtool -print -quit)"
          if [ -z "$ctrtool" ]; then
            echo "::error::CTRTool executable was not found in the release archive"
            exit 1
          fi
          chmod +x "$ctrtool"
          echo "CTRTOOL_PATH=$ctrtool" >> "$GITHUB_ENV"
      - name: Install pinned analysis and download dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements-analysis.txt 'gdown==6.4.2'

      - name: Inspect user-provided image in temporary storage
        env:
          PYTHONUNBUFFERED: "1"
          POKEULTRARECOMP_SOURCE_URL: ${{ secrets.POKEULTRARECOMP_SOURCE_URL }}
          POKEULTRARECOMP_SOURCE_URL_FALLBACK: ${{ secrets.POKEULTRARECOMP_SOURCE_URL_FALLBACK }}
          TARGET: ${{ inputs.target || 'ultra-sun' }}
          IMAGE_FORMAT: ${{ inputs.format || 'cci' }}
          NCCH_INDEX: ${{ inputs.ncch_index || '0' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$NCCH_INDEX" =~ ^[0-9]{1,5}$ ]] || [ "$NCCH_INDEX" -gt 65535 ]; then
            echo "::error::ncch_index must be an integer from 0 to 65535"
            exit 2
          fi
          python tools/remote_3ds_intake.py \
            --target "$TARGET" \
            --format "$IMAGE_FORMAT" \
            --ncch-index "$NCCH_INDEX" \
            --ctrtool "$CTRTOOL_PATH" \
            --ghidra-headless "$GHIDRA_HEADLESS_PATH"
