name: Local analysis tooling smoke tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/analysis-tools.yml"
      - "tools/disassemble_retail_range.py"
      - "tools/inspect_3ds_target.py"
      - "tools/requirements-analysis.txt"
      - "tools/smoke_capstone_integration.py"
      - "tools/summarize_arm_function_candidates.py"
      - "tools/smoke_candidate_return_analysis.py"
      - "targets/**"

permissions:
  contents: read

jobs:
  capstone-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned local analysis dependency
        run: python -m pip install --disable-pip-version-check -r tools/requirements-analysis.txt
      - name: Decode synthetic Thumb bytes using real Capstone
        run: python tools/smoke_capstone_integration.py
      - name: Verify bounded ARM/Thumb candidate return scan
        run: python tools/smoke_candidate_return_analysis.py
