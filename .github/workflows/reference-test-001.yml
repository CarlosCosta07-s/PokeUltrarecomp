name: Reference test 001 — synthetic override parser

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/reference-test-001.yml"
      - "docs/REFERENCE_TEST_001.md"
      - "docs/BUILD_NOTES.md"
      - "docs/ROADMAP.md"

permissions:
  contents: read

jobs:
  synthetic-override-parser:
    name: 3dsrecomp override parser (no game input)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out the pinned reference revision
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          repository: fearkov/3dsrecomp
          ref: c3f21f94ba50d688025febc8974ff348d471b587
          path: reference/3dsrecomp
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0

      - name: Record tool versions
        run: |
          rustc --version
          cargo --version

      - name: Run synthetic parser unit tests
        working-directory: reference/3dsrecomp
        run: cargo test --locked --lib overrides::tests -- --nocapture
