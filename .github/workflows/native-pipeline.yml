name: Native recompilation smoke tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-recompilation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-smoke:
    name: Native pipeline (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install native build tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake ninja-build

      - name: Configure and verify with CMake/Ninja (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target verify

      - name: Initialize MSVC and verify with CMake/Ninja (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          @echo off
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find VC\Auxiliary\Build\vcvars64.bat`) do call "%%i"
          if not defined VSCMD_VER exit /b 1
          set CC=cl
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          if errorlevel 1 exit /b 1
          set CC=
          cmake --build build --target verify
          if errorlevel 1 exit /b 1
